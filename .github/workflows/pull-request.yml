name: Pull Request

on:
  pull_request:
    # labeled/unlabeled: re-check when the release label (major/minor/...) changes
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check-version-increase:
    name: Check version tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
      - run: pnpm exec auto pr-check --url https://github.com/$GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-canary:
    name: Publish a Canary version
    needs: check-version-increase
    runs-on: ubuntu-latest
    # forks get no OIDC token, so they can't publish anyway
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write # auto writes the canary version into the PR body
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # auto needs tags and history
      - uses: pnpm/setup@v3
        with:
          runtime: node@26 # bundles npm >= 11.5.1, required for trusted publishing
          cache: false # no shared cache in a job that can publish
      - run: pnpm run build
      - run: pnpm exec auto shipit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
